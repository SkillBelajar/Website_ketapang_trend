# FastCGI Cache Path definition in RAM tmpfs
fastcgi_cache_path /var/cache/nginx/fastcgi levels=1:2 keys_zone=WORDPRESS:100m max_size=200m inactive=60m;
fastcgi_cache_key "$scheme$request_method$host$request_uri";

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    # Global debug header for cache status
    add_header X-FastCGI-Cache $upstream_cache_status always;

    # Cache bypass conditions
    set $skip_cache 0;

    # 1. POST requests must bypass cache
    if ($request_method = POST) {
        set $skip_cache 1;
    }

    # 2. URLs with a query string must bypass cache
    if ($query_string != "") {
        set $skip_cache 1;
    }

    # 3. Specific WordPress endpoints that must never be cached
    if ($request_uri ~* "(/wp-admin/|/xmlrpc.php|wp-.*.php|/feed/|index.php|sitemap(_index)?.xml)") {
        set $skip_cache 1;
    }

    # 4. Logged in users or commenters must bypass cache
    if ($http_cookie ~* "(wordpress_logged_in_|comment_author_|wp-postpass_)") {
        set $skip_cache 1;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Healthcheck endpoint for Docker healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # PHP-FPM processing with FastCGI Cache
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # FastCGI Cache Configuration
        fastcgi_cache WORDPRESS;
        fastcgi_cache_valid 200 301 302 60m;
        fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;
        fastcgi_cache_lock on;
        fastcgi_cache_lock_timeout 5s;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;

        # Ensure debug header is included in PHP responses
        add_header X-FastCGI-Cache $upstream_cache_status always;
    }

    # Static assets caching (30 days)
    location ~* \.(css|js|jpg|jpeg|png|webp|svg|woff2|woff|ttf|ico|gif|eot|mp4|ogg|ogv|webm)$ {
        expires 30d;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, max-age=2592000, no-transform";
        try_files $uri =404;
    }

    # Block access to xmlrpc.php
    location = /xmlrpc.php {
        deny all;
        access_log off;
        log_not_found off;
        return 403;
    }

    # Block access to hidden files (.htaccess, .env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 403;
    }
}
